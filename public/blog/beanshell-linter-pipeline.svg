<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="t d">
  <title id="t">How the BeanShell XML linter processes a file</title>
  <desc id="d">An XML file flows through extraction, a BeanShell syntax check, comment and string masking, the lint rules, and finally a report with an exit code.</desc>
  <rect width="900" height="250" rx="14" fill="#1f1f2b"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a9a5ff"/></marker>
  </defs>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#2d2b55" stroke="#6c63ff" stroke-width="2">
      <rect x="20" y="80" width="140" height="80" rx="10"/>
      <rect x="190" y="80" width="140" height="80" rx="10"/>
      <rect x="360" y="80" width="140" height="80" rx="10"/>
      <rect x="530" y="80" width="140" height="80" rx="10"/>
      <rect x="700" y="80" width="180" height="80" rx="10"/>
    </g>
    <g fill="#ffffff" font-size="17" font-weight="bold">
      <text x="90" y="115">Extract</text>
      <text x="260" y="115">Syntax check</text>
      <text x="430" y="115">Mask</text>
      <text x="600" y="115">Lint rules</text>
      <text x="790" y="115">Report</text>
    </g>
    <g fill="#c9c7ee" font-size="13">
      <text x="90" y="138">pull every</text><text x="90" y="154">&lt;Source&gt; block</text>
      <text x="260" y="138">real BeanShell</text><text x="260" y="154">parser</text>
      <text x="430" y="138">blank comments</text><text x="430" y="154">and strings</text>
      <text x="600" y="138">19 regex rules</text><text x="600" y="154">on masked text</text>
      <text x="790" y="138">file:line findings</text><text x="790" y="154">and an exit code</text>
    </g>
    <g stroke="#a9a5ff" stroke-width="2.5" marker-end="url(#a)">
      <line x1="160" y1="120" x2="188" y2="120"/>
      <line x1="330" y1="120" x2="358" y2="120"/>
      <line x1="500" y1="120" x2="528" y2="120"/>
      <line x1="670" y1="120" x2="698" y2="120"/>
    </g>
    <text x="90" y="40" fill="#ffffff" font-size="15">rule.xml</text>
    <text x="260" y="200" fill="#ff8f8f" font-size="13">syntax errors are ERRORs</text>
    <text x="600" y="200" fill="#ffd98f" font-size="13">rule hits are WARNINGs</text>
    <text x="790" y="200" fill="#c9c7ee" font-size="13">non-zero exit fails the build</text>
  </g>
</svg>
